# /etc/nginx/sites-available/threepl
server {
    listen 80;
    server_name portal.example.com;   # your domain

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
# After DNS points here: sudo certbot --nginx -d portal.example.com
